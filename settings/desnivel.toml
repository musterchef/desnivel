[trip.timing]
internal_rate_hz = 10.0

[trip.gpx]
speed_reference_kmh = 25.0
slope_reference = 0.08
effort_weight_speed = 0.4
effort_weight_slope = 0.6
raw_median_window = 3
max_speed_kmh = 70.0
spike_max_removed_points = 2
spike_max_gap_s = 60.0
spike_min_detour_ratio = 0.5
recording_gap_s = 30.0
stop_min_duration_s = 300.0
stop_radius_m = 3.0
pause_min_gap_s = 8.0
pause_gap_factor = 3.0
pause_max_speed_kmh = 5.0

[trip.quality]
top_count = 10
neighbor_points = 3
group_gap_s = 60.0
context_s = 60.0
sampling_gap_s = 30.0
gap_distance_m = 100.0
stationary_duration_s = 30.0
stationary_radius_m = 10.0
resume_distance_m = 50.0

[trip.analysis]
sample_distance_m = 100.0
slope_window_m = 300.0
min_zone_distance_m = 300.0

[[trip.analysis.bands]]
name = "steep_descent"

[[trip.analysis.bands]]
name = "descent"
from_slope_ratio = -0.06

[[trip.analysis.bands]]
name = "level"
from_slope_ratio = -0.015

[[trip.analysis.bands]]
name = "climb"
from_slope_ratio = 0.015

[[trip.analysis.bands]]
name = "steep_climb"
from_slope_ratio = 0.06

[trip.grouping.families]
ascent = ["climb", "steep_climb"]
descent = ["descent", "steep_descent"]
level = ["level"]

[trip.route_structure]
merge_reversals = true
max_relative_elevation = 0.2
max_relative_distance = 0.2
max_reversal_distance_m = 400.0
min_recovery_ratio = 1.0

[transport.osc]
host = "127.0.0.1"
port = 9000
trip_metrics_rate_hz = 1.0
